<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>力恆 ♥ 珮珊 婚宴桌次查詢</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #faf3e7;
      --cream-soft:  #f4ead8;
      --ivory:       #fffaf0;
      --beige:       #d8c4a3;
      --beige-deep:  #b89e76;
      --blush:       #e6b7a3;
      --blush-deep:  #c98870;
      --sage:        #a9b59a;
      --sage-deep:   #7d8c6f;
      --ink:         #5b4a37;
      --ink-soft:    #8a755a;
      --ink-faint:   rgba(91, 74, 55, 0.45);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background: var(--cream);
      color: var(--ink);
    }

    /* ── Soft cream base wash ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 50% 45%, #ffffff 0%, var(--cream) 55%, var(--cream-soft) 100%);
    }

    /* ── Floral page backdrop ── */
    .venue-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('background.webp');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    @media (max-aspect-ratio: 9/16) and (pointer: coarse) {
      .venue-bg {
        background-image: url('background-mobile.webp');
      }
    }

    /* ── Subtle watercolor heart in the middle (background) ── */
    .heart-bg {
      position: fixed;
      top: 50%; left: 50%;
      width: clamp(340px, 50vw, 620px);
      height: clamp(340px, 50vw, 620px);
      z-index: 1;
      pointer-events: none;
      opacity: 0.3;
      filter: blur(1px);
      transform-origin: 50% 50%;
      animation: heartbeat-bg 1.6s ease-in-out infinite;
    }

    @keyframes heartbeat-bg {
      0%   { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
      14%  { transform: translate(-50%, -50%) rotate(-8deg) scale(1.06); }
      28%  { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
      42%  { transform: translate(-50%, -50%) rotate(-8deg) scale(1.04); }
      70%, 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-bg { animation: none; }
    }

    /* ── Floating carrots ── */
    .carrots {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .carrot {
      position: absolute;
      width: 110px;
      height: auto;
      opacity: 0.55;
      will-change: transform;
      filter: drop-shadow(0 3px 6px rgba(120, 80, 50, 0.15));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .carrot.drift-a { animation-name: carrot-drift-a; }
    .carrot.drift-b { animation-name: carrot-drift-b; }
    .carrot.drift-c { animation-name: carrot-drift-c; }
    .carrot.drift-d { animation-name: carrot-drift-d; }

    @keyframes carrot-drift-a {
      0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
      20%  { transform: translate(90px, -60px) rotate(calc(var(--rot, 0deg) + 18deg)); }
      40%  { transform: translate(40px, -150px) rotate(calc(var(--rot, 0deg) - 12deg)); }
      60%  { transform: translate(-80px, -110px) rotate(calc(var(--rot, 0deg) + 22deg)); }
      80%  { transform: translate(-60px, -30px) rotate(calc(var(--rot, 0deg) - 8deg)); }
      100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
    }
    @keyframes carrot-drift-b {
      0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
      25%  { transform: translate(-120px, 40px) rotate(calc(var(--rot, 0deg) - 20deg)); }
      50%  { transform: translate(-70px, 130px) rotate(calc(var(--rot, 0deg) + 14deg)); }
      75%  { transform: translate(60px, 80px) rotate(calc(var(--rot, 0deg) - 6deg)); }
      100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
    }
    @keyframes carrot-drift-c {
      0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
      30%  { transform: translate(70px, 90px) rotate(calc(var(--rot, 0deg) + 25deg)); }
      55%  { transform: translate(140px, -20px) rotate(calc(var(--rot, 0deg) - 18deg)); }
      80%  { transform: translate(30px, -90px) rotate(calc(var(--rot, 0deg) + 10deg)); }
      100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
    }
    @keyframes carrot-drift-d {
      0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
      22%  { transform: translate(-50px, -100px) rotate(calc(var(--rot, 0deg) + 16deg)); }
      48%  { transform: translate(80px, -70px) rotate(calc(var(--rot, 0deg) - 22deg)); }
      72%  { transform: translate(110px, 60px) rotate(calc(var(--rot, 0deg) + 8deg)); }
      100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .carrot { animation: none; }
    }

    /* Soft cream paper grain */
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(230,183,163,0.10) 0, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(169,181,154,0.08) 0, transparent 40%),
        radial-gradient(circle at 60% 20%, rgba(216,196,163,0.10) 0, transparent 35%);
      mix-blend-mode: multiply;
    }

    /* ── Screen base ── */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 14vw;
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
    }
    @media (max-aspect-ratio: 1/1) {
      .screen { padding: 0 12vw; }
    }
    .screen.active {
      opacity: 1; transform: translateY(0); pointer-events: all;
    }
    .screen.exit-up {
      opacity: 0; transform: translateY(-40px);
    }
    .screen.enter-down {
      opacity: 0; transform: translateY(40px);
    }

    /* ── Title ── */
    .title-wrap { text-align: center; margin-bottom: 42px; }

    .title-en {
      font-family: 'Cormorant Garamond', 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.1rem, 2.6vw, 1.6rem);
      color: var(--blush-deep);
      letter-spacing: 0.32em;
      opacity: 0.85;
      text-transform: lowercase;
    }

    .title-zh {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.12em;
      margin: 10px 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .title-zh .name { color: var(--ink); }

    .title-zh .heart {
      color: var(--blush-deep);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.85em;
      transform: translateY(-0.05em);
      opacity: 0.85;
    }

    .title-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      color: var(--sage-deep);
      letter-spacing: 0.45em;
      font-weight: 400;
      margin-top: 4px;
    }

    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 18px auto 8px; width: fit-content;
      color: var(--beige-deep);
    }
    .divider::before, .divider::after {
      content: '';
      display: block;
      width: 70px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--beige-deep));
    }
    .divider::after { transform: scaleX(-1); }
    .divider-icon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      opacity: 0.85;
      letter-spacing: 0.1em;
    }

    /* ── Input area ── */
    .input-wrap {
      position: relative;
      width: clamp(260px, 56vw, 460px);
    }

    .input-label {
      display: block;
      font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--ink-soft);
      letter-spacing: 0.3em;
      margin-bottom: 18px;
      text-align: center;
      font-weight: 400;
      font-style: italic;
    }

    .search-box {
      width: 100%;
      padding: 16px 28px;
      font-size: clamp(1.3rem, 3.6vw, 1.8rem);
      font-family: 'Noto Serif TC', serif;
      font-weight: 400;
      background: rgba(255, 250, 240, 0.7);
      border: none;
      border-bottom: 1.5px solid var(--beige-deep);
      border-radius: 0;
      color: var(--ink);
      text-align: center;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      caret-color: var(--blush-deep);
      letter-spacing: 0.06em;
    }
    .search-box::placeholder {
      color: var(--ink-faint);
      font-style: italic;
      letter-spacing: 0.15em;
    }
    .search-box:focus {
      border-bottom-color: var(--blush-deep);
      box-shadow: 0 6px 18px -10px rgba(201, 136, 112, 0.45);
      background: rgba(255, 250, 240, 0.95);
    }

    .search-hint {
      text-align: center;
      margin-top: 22px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      color: var(--ink-faint);
      letter-spacing: 0.2em;
    }
    .search-hint .sep {
      display: inline-block;
      margin: 0 10px;
      color: var(--beige-deep);
    }

    /* ── Progress bar (debounce indicator) ── */
    .progress-wrap {
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 2px;
      background: transparent;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .progress-wrap.active { opacity: 1; }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--blush), var(--blush-deep), var(--sage));
      width: 0%;
      transition: width linear;
    }

    /* ── Result screen ── */
    /* ── Result screen — full-bleed shell ── */
    #resultScreen {
      padding: 0;
      justify-content: stretch;
      align-items: stretch;
    }

    .result-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: clamp(12px, 2vh, 24px) clamp(14px, 3vw, 36px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Venue zone: laid out from the start, opacity fades in during morph ── */
    .venue-zone {
      width: 100%;
      flex: 1 1 0;
      min-height: 0;     /* allow flex item to shrink below SVG intrinsic size */
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.9s ease 0.4s;
    }
    .result-shell.morphing .venue-zone { opacity: 1; }
    .venue-zone svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    /* ── Hero overlay (covers shell, centers initially, shrinks to table) ── */
    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      gap: clamp(14px, 2vh, 26px);
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s ease,
                  transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .result-shell.morphing .hero-info {
      opacity: 0;
      transform: translateY(-18px);
    }
    .hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 1.5vh, 1.1rem);
      color: var(--sage-deep);
      letter-spacing: 0.4em;
      text-transform: lowercase;
    }
    .hero-name {
      font-family: 'Noto Serif TC', serif;
      font-weight: 500;
      font-size: clamp(2rem, 5vh, 3rem);
      color: var(--ink);
      letter-spacing: 0.14em;
      line-height: 1.1;
    }

    /* The morphing circle — only this element animates position+scale */
    .hero-circle {
      width: clamp(180px, 28vh, 280px);
      height: clamp(180px, 28vh, 280px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffaf0, #f4ead8 70%, #e8d6b6 100%);
      box-shadow:
        0 18px 40px -18px rgba(91, 74, 55, 0.35),
        inset 0 0 0 1.5px rgba(184, 158, 118, 0.45),
        inset 0 -10px 28px rgba(216, 196, 163, 0.25);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transform-origin: center center;
      transform: translate(0, 0) scale(1);
      transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1),
                  opacity 0.4s ease,
                  box-shadow 1.1s ease;
    }
    .hero-circle::before {
      content: '';
      position: absolute; inset: 7px;
      border-radius: 50%;
      border: 1px dashed rgba(184, 158, 118, 0.55);
      pointer-events: none;
    }
    .result-shell.morphing .hero-circle {
      transform: translate(var(--tx, 0), var(--ty, 0)) scale(var(--s, 0.15));
      box-shadow: 0 0 0 0 transparent;
    }
    .result-shell.morphed .hero-circle {
      opacity: 0;
    }

    .hero-num {
      font-family: 'Playfair Display', 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(5rem, 16vh, 9rem);
      line-height: 1;
      color: var(--blush-deep);
      text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    }

    .hero-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 1.5vh, 1rem);
      color: var(--ink-soft);
      letter-spacing: 0.28em;
      transition: opacity 0.5s ease, transform 0.7s ease;
    }
    .result-shell.morphing .hero-sub {
      opacity: 0;
      transform: translateY(12px);
    }

    /* ── Footer (countdown + return) ── */
    .reveal-foot {
      width: 100%;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vw, 36px);
      padding-top: clamp(6px, 1vh, 14px);
      opacity: 0;
      transition: opacity 0.5s ease 0.7s;
    }
    .result-shell.morphing .reveal-foot { opacity: 1; }
    .reveal-foot .countdown-wrap { margin-top: 0; }
    .reveal-foot .btn-home { margin: 0; padding: 7px 26px; font-size: 0.9rem; }

    /* Portrait / narrow */
    @media (max-aspect-ratio: 4/5), (max-width: 640px) {
      .hero-circle {
        width: clamp(150px, 22vh, 220px);
        height: clamp(150px, 22vh, 220px);
      }
      .hero-num { font-size: clamp(4rem, 13vh, 7rem); }
      .hero-name { font-size: clamp(1.6rem, 4vh, 2.4rem); }
    }

    /* Venue elements */
    .v-table-circle { fill: #fffaf0; stroke: #b89e76; stroke-width: 1.2; }
    .v-table-num { font-family: 'Noto Serif TC', serif; font-size: 14px; fill: #5b4a37; text-anchor: middle; dominant-baseline: central; font-weight: 500; }
    .v-room-outline { fill: none; stroke: #b89e76; stroke-width: 1; stroke-dasharray: 3 3; }
    .v-stage-box { fill: #fffaf0; stroke: #5b4a37; stroke-width: 1.2; }
    .v-stage-label { font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 16px; fill: #8a3a2a; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.1em; }
    .v-screen { fill: #c0392b; }
    .v-screen-label { font-family: 'Noto Serif TC', serif; font-size: 9px; fill: #fffaf0; text-anchor: middle; dominant-baseline: central; font-weight: 500; }
    .v-carpet { fill: url(#carpetGrad); }
    .v-entrance-label { font-family: 'Noto Serif TC', serif; font-size: 11px; fill: #5b4a37; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.2em; }
    .v-main { fill: #fffaf0; stroke: #5b4a37; stroke-width: 1.5; }
    .v-main-label { font-family: 'Noto Serif TC', serif; font-size: 13px; fill: #5b4a37; text-anchor: middle; dominant-baseline: central; font-weight: 500; }
    .v-main-highlight {
      fill: #c98870;
      stroke: #8a3a2a;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 14px rgba(201, 136, 112, 0.75));
    }
    .v-main-highlight + .v-main-label { fill: #fffaf0; font-weight: 700; }

    /* Highlighted table — visible only after morph arrives */
    .v-highlight-pulse {
      fill: #c98870;
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
    }
    .result-shell.morphed .v-highlight-pulse {
      animation: vPulse 1.6s ease-out infinite;
    }
    @keyframes vPulse {
      0%   { transform: scale(0.95); opacity: 0.55; }
      80%  { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .v-table-highlight {
      fill: #c98870;
      stroke: #8a3a2a;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 10px rgba(201, 136, 112, 0.7));
    }
    .v-table-highlight + .v-table-num { fill: #fffaf0; font-weight: 700; }

    /* ── Countdown ring ── */
    .countdown-wrap {
      margin-top: 28px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    .countdown-ring {
      width: 36px; height: 36px;
      position: relative;
    }

    .countdown-ring svg { transform: rotate(-90deg); }

    .countdown-ring circle {
      fill: none;
      stroke: rgba(184, 158, 118, 0.25);
      stroke-width: 2.5;
    }
    .countdown-ring .progress-circle {
      stroke: var(--blush-deep);
      stroke-dasharray: 88;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .countdown-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      color: var(--blush-deep);
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    .countdown-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--ink-soft);
      letter-spacing: 0.18em;
    }

    .btn-home {
      margin-top: 22px;
      padding: 11px 36px;
      border: 1px solid var(--blush-deep);
      border-radius: 0;
      background: var(--blush-deep);
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: all 0.25s;
      display: block;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 8px rgba(91, 74, 55, 0.15);
    }
    .btn-home:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--ivory);
    }

    /* ── Not Found screen ── */
    .notfound-card {
      text-align: center;
      padding: 8px 0;
    }

    .notfound-icon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 2.4rem;
      margin-bottom: 18px;
      color: var(--sage-deep);
      letter-spacing: 0.1em;
    }

    .notfound-name {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(1.4rem, 3.8vw, 2.2rem);
      color: var(--ink);
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .notfound-msg {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--ink-soft);
      letter-spacing: 0.2em;
      font-weight: 400;
    }

    .notfound-assist {
      margin-top: 18px;
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      color: var(--blush-deep);
      letter-spacing: 0.14em;
      font-weight: 400;
    }

    .btn-retry {
      margin-top: 30px;
      padding: 11px 36px;
      border: 1px solid var(--blush-deep);
      border-radius: 0;
      background: var(--blush-deep);
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 2px 8px rgba(91, 74, 55, 0.15);
    }
    .btn-retry:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--ivory);
    }

    /* ── Mobile (portrait phones): map secondary, hero always-on ── */
    @media (max-width: 640px) {
      .screen { padding: 0 6vw; }

      .title-wrap { margin-bottom: 26px; }
      .divider::before, .divider::after { width: 48px; }

    // Build lookup: remove spaces + lower for fuzzy match
    function normalize(s) {
      return s.replace(/\s+/g, '').toLowerCase();
    }

    const normalizedKeys = Object.keys(SEATING).map(k => ({ original: k, norm: normalize(k) }));

    function lookup(query) {
      const q = normalize(query);
      if (!q) return null;
      // 1. exact normalized match
      let hit = normalizedKeys.find(k => k.norm === q);
      if (hit) return { name: hit.original, table: SEATING[hit.original] };
      // 2. contains match
      hit = normalizedKeys.find(k => k.norm.includes(q) || q.includes(k.norm));
      if (hit) return { name: hit.original, table: SEATING[hit.original] };
      // 3. partial char match (any 2+ chars)
      if (q.length >= 2) {
        hit = normalizedKeys.find(k => {
          for (let i = 0; i <= q.length - 2; i++) {
            if (k.norm.includes(q.slice(i, i + 2))) return true;
          }
          return false;
        });
        if (hit) return { name: hit.original, table: SEATING[hit.original] };
      }
      return null;

        c.setAttribute('class', isHl ? 'v-table-highlight' : 'v-table-circle');
        c.setAttribute('cx', pos.x);
        c.setAttribute('cy', pos.y);
        c.setAttribute('r', TABLE_RADIUS);
        c.setAttribute('data-table', num);
        venueTables.appendChild(c);
        const t = document.createElementNS(svgNS, 'text');
        t.setAttribute('class', 'v-table-num');
        t.setAttribute('x', pos.x);
        t.setAttribute('y', pos.y);
        t.textContent = num;
        venueTables.appendChild(t);
      });
    }

    // ── Screen transitions ────────────────────────────────────────
    function showScreen(target) {
      [inputScreen, resultScreen, notFoundScreen].forEach(s => {
        if (s === target) {
          s.classList.remove('exit-up', 'enter-down');
          s.classList.add('active');
        } else if (s.classList.contains('active')) {
          s.classList.remove('active');
          s.classList.add('exit-up');
          setTimeout(() => s.classList.remove('exit-up'), 700);
        }
      });
    }

    // ── Mobile detection (matches the CSS breakpoint) ─────────────
    const mobileMQ = window.matchMedia('(max-width: 640px)');
    function isMobileViewport() { return mobileMQ.matches; }

    // ── Countdown logic ───────────────────────────────────────────
    const CIRCUMFERENCE = 2 * Math.PI * 14; // r=14 → ~87.96
    const COUNTDOWN_TOTAL = 6;
    let countdownTimer = null;
    let countdownSec = COUNTDOWN_TOTAL;
    let notFoundTimer = null;

    function startCountdown() {
      clearTimeout(countdownTimer);
      countdownSec = COUNTDOWN_TOTAL;
      updateRing(countdownSec);

      function tick() {
        countdownSec--;
        updateRing(countdownSec);
        if (countdownSec <= 0) {
          returnToInput();
        } else {
          countdownTimer = setTimeout(tick, 1000);
        }
      }
      countdownTimer = setTimeout(tick, 1000);
    }

    function updateRing(sec) {
      const fraction = sec / COUNTDOWN_TOTAL;
      countdownCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
      countdownNum.textContent = sec;
    }

    const NOTFOUND_TOTAL = 2;
    let notFoundSec = NOTFOUND_TOTAL;

    function startNotFoundCountdown() {
      clearTimeout(notFoundTimer);
      notFoundSec = NOTFOUND_TOTAL;
      updateNotFoundRing(notFoundSec);

      function tick() {
        notFoundSec--;
        updateNotFoundRing(notFoundSec);
        if (notFoundSec <= 0) {
          returnToInput();
        } else {
          notFoundTimer = setTimeout(tick, 1000);
        }
      }
      notFoundTimer = setTimeout(tick, 1000);
    }

    function updateNotFoundRing(sec) {
      const fraction = sec / NOTFOUND_TOTAL;
      notFoundCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
      notFoundNum.textContent = sec;
    }

    function returnToInput() {
      clearTimeout(countdownTimer);
      clearTimeout(notFoundTimer);
      clearTimeout(morphTimer);
      clearTimeout(morphedTimer);
      resultShell.classList.remove('morphing', 'morphed');
      // reset hero transform vars so next entrance starts clean
      heroCircle.style.removeProperty('--tx');
      heroCircle.style.removeProperty('--ty');
      heroCircle.style.removeProperty('--s');
      showScreen(inputScreen);
      setTimeout(() => {
        searchInput.value = '';
        searchInput.focus();
      }, 400);
    }

    let morphTimer = null;
    let morphedTimer = null;
    const MORPH_DELAY = 2200;  // how long the big circle stays centered
    const MORPH_DUR   = 1100;  // matches CSS transition duration

    function scheduleMorph(tableNum) {
      clearTimeout(morphTimer);
      clearTimeout(morphedTimer);

      // wait two frames so layout (venue SVG) is fully measured
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const target = document.querySelector(`#venueZone circle[data-table="${tableNum}"]`);
          if (!target) {
            // no position on map — just fade venue in without morph
            resultShell.classList.add('morphing', 'morphed');
            return;
          }
          const hRect = heroCircle.getBoundingClientRect();
          const tRect = target.getBoundingClientRect();
          const dx = (tRect.left + tRect.width / 2) - (hRect.left + hRect.width / 2);
          const dy = (tRect.top  + tRect.height / 2) - (hRect.top  + hRect.height / 2);
          const scale = tRect.width / hRect.width;

          heroCircle.style.setProperty('--tx', `${dx}px`);
          heroCircle.style.setProperty('--ty', `${dy}px`);
          heroCircle.style.setProperty('--s', scale.toFixed(4));

          morphTimer = setTimeout(() => {
            resultShell.classList.add('morphing');
            morphedTimer = setTimeout(() => {
              resultShell.classList.add('morphed');
            }, MORPH_DUR);
          }, MORPH_DELAY);
        });
      });
    }

    // ── Search submission ─────────────────────────────────────────
    function doSearch(query) {
      query = query.trim();
      if (!query) return;

      progressWrap.classList.remove('active');
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';

      const result = lookup(query);
      if (result) {
        resultName.textContent = result.name;
        tableNumber.textContent = result.table;
        countdownCircle.style.strokeDashoffset = 0;
        renderVenueTables(result.table);
        resultShell.classList.remove('morphing', 'morphed');
        // reset transform so the entrance animation replays
        heroCircle.style.removeProperty('--tx');
        heroCircle.style.removeProperty('--ty');
        heroCircle.style.removeProperty('--s');
        showScreen(resultScreen);
        scheduleMorph(result.table);
        if (!isMobileViewport()) startCountdown();
      } else {
        notFoundName.textContent = `「${query}」`;
        notFoundCircle.style.strokeDashoffset = 0;
        showScreen(notFoundScreen);
        if (!isMobileViewport()) startNotFoundCountdown();
      }
    }

    // ── Input source detection (keyboard vs voice-AI injection) ───
    // Keyboard typing → keydown fires before input. Voice tools (Typeless等)
    // 直接寫入 value，不會觸發 keydown。我們用 keydown 的時間戳判斷來源。
    // 鍵盤 → 不自動送出（按 Enter 才送）
    // 語音 → 自動送出（短 debounce 等同一段語音整批寫入完成）
    const KEY_RECENT_MS  = 150;   // input 事件前多久內有 keydown 算「鍵盤輸入」
    const VOICE_DEBOUNCE = 350;   // 語音整批寫入後等待一小段確保結束才送出

    let lastKeydownAt = 0;
    let isComposing   = false;    // IME 中文組字中
    let voiceTimer    = null;

    searchInput.addEventListener('keydown', () => {
      lastKeydownAt = Date.now();
    });

    searchInput.addEventListener('compositionstart', () => { isComposing = true; });
    searchInput.addEventListener('compositionend',   () => {
      isComposing = false;
      // IME 組字完成本身也是鍵盤輸入，記一筆時間戳避免被誤判成語音
      lastKeydownAt = Date.now();
    });

    searchInput.addEventListener('input', (e) => {
      const val = searchInput.value.trim();

      clearTimeout(voiceTimer);
      progressWrap.classList.remove('active');
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';

      if (!val || isComposing) return;

      const sinceKey  = Date.now() - lastKeydownAt;
      const fromPaste = e.inputType === 'insertFromPaste';
      const fromVoice = e.inputType === 'insertFromDictation';
      // 判定為「非鍵盤」：明確 paste/dictation，或最近沒有 keydown
      const isInjected = fromPaste || fromVoice || sinceKey > KEY_RECENT_MS;

      if (!isInjected) return;  // 鍵盤輸入 → 不自動送出

      // 語音/注入：顯示進度條並在短 debounce 後送出
      progressWrap.classList.add('active');
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      void progressBar.offsetWidth;
      progressBar.style.transition = `width ${VOICE_DEBOUNCE}ms linear`;
      progressBar.style.width = '100%';

      voiceTimer = setTimeout(() => {
        doSearch(searchInput.value);
      }, VOICE_DEBOUNCE);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      // IME 注音/中文組字中按 Enter 是選字，不該送出
      // 同時檢查事件層級的 isComposing 與 keyCode 229（部分瀏覽器在
      // compositionend 之後仍會把這個 Enter 視為組字結束鍵）
      if (isComposing || e.isComposing || e.keyCode === 229) return;
      clearTimeout(voiceTimer);
      doSearch(searchInput.value);
    });

    retryBtn.addEventListener('click', returnToInput);
    homeBtn.addEventListener('click', returnToInput);

    // ── Init ──────────────────────────────────────────────────────
    setTimeout(() => searchInput.focus(), 300);
  </script>
</body>
</html>
